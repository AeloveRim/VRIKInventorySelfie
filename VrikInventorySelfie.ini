[General]
; Distance in front of the player to place the body (in Skyrim units)
Distance = 90.0

; Vertical offset relative to the player's root/feet position (in Skyrim
; units). 0 keeps the body roughly floor-level. Raise this (positive values)
; if the body still looks slightly sunk into the ground for your character;
; lower it (negative values) if it looks like it's floating.
HeightOffset = 0.0

; Sideways offset from directly in front of the player (in Skyrim units).
; Positive values move the body to your right, negative values to your left,
; 0 keeps it centered directly ahead of you.
Horizontality = 0.0

; Degrees added to the player's facing angle to get the body's facing angle.
; 180 (default) makes the body face back towards the player, as if looking
; in a mirror. 0 would make it face the same direction as the player (facing
; away from you). Any value 0-360 works.
RotationOffset = 180.0

; Logs a line on every menu open/close plus the computed lock position and a
; settings readback. Useful when tuning the settings above or diagnosing an
; issue; leave false for normal play to avoid log spam.
VerboseLogging = false

; When true, re-reads this ini file every time you open your inventory, so
; you can edit Distance/HeightOffset/Horizontality/RotationOffset above,
; save the file, and see the change on your next inventory open without
; restarting the game. Turning DebugMode on itself still requires a fresh
; load of this ini (restart the game or load a save) to take effect the
; first time; after that, further edits to the other settings apply live.
; Leave false for normal play -- it adds a disk read on every inventory
; open, which is fine for tuning but unnecessary otherwise.
DebugMode = false

; Milliseconds to wait, after you close all menus, before fully releasing
; the VRIK position/rotation lock.
UnlockDelayMs = 50

[BodyVisibility]
; Which menus will make the selfie body appear. It will then stay
; visible until you exit all menus.
Tween = true
Inventory = true
Magic = false
Container = false
Barter = false
